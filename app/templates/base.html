<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}what is a katie{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <header class="site-header">
    <nav class="nav wrap">
      <a class="nav-brand" href="{{ url_for('index') }}"><span class="brand-star" aria-hidden="true">✦</span> what is a katie</a>
      <ul class="nav-links">
        <li><a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ url_for('projects') }}" {% if request.endpoint == 'projects' %}aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="{{ url_for('resume') }}" {% if request.endpoint == 'resume' %}aria-current="page"{% endif %}>Resume</a></li>
      </ul>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  {% if not hide_footer %}
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© 2025 Katie</span>
      <span class="footer-links">
        <a href="https://github.com/ohitsmekatie" target="_blank" rel="noopener">
          <i class="fab fa-github" aria-hidden="true"></i> GitHub
        </a>
        <a href="https://linkedin.com/in/katiesipos" target="_blank" rel="noopener">
          <i class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn
        </a>
        <a href="mailto:katie.sipos@gmail.com">
          <i class="fas fa-envelope" aria-hidden="true"></i> Email
        </a>
      </span>
    </div>
  </footer>
  {% endif %}

</body>
</html>
