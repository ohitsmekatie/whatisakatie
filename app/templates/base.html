<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %} what is a katie{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme-color for browser UI (updated by JS as well) -->
  <meta name="theme-color" content="#ffffff" />

  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <!-- INITIAL THEME (runs before paint to avoid FOUC) -->
  <script>
    (function () {
      const STORAGE_KEY = "site-theme";
      const stored = localStorage.getItem(STORAGE_KEY);
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = (stored === "light" || stored === "dark") ? stored : (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      // Keep browser UI (mobile address bar) in sync
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0d0d0d" : "#ffffff");
      // Watch system changes only if user hasn't chosen explicitly
      try {
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        mq.addEventListener?.("change", e => {
          if (!localStorage.getItem(STORAGE_KEY)) {
            const t = e.matches ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", t);
            if (meta) meta.setAttribute("content", t === "dark" ? "#0d0d0d" : "#ffffff");
            const on = document.getElementById("theme-icon-on");
            const off = document.getElementById("theme-icon-off");
            if (on && off) { on.style.display = t === "dark" ? "inline-block" : "none"; off.style.display = t === "dark" ? "none" : "inline-block"; }
            const btn = document.getElementById("theme-toggle");
            if (btn) btn.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
          }
        });
      } catch {}
    })();
  </script>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand glitch-title nav-glitch" href="{{ url_for('index') }}">
        <i class="fas fa-terminal me-2"></i> what is a katie
      </a>

      <!-- THEME TOGGLE BUTTON (always visible) -->
      <button
        id="theme-toggle"
        class="btn btn-sm ms-auto d-lg-none"
        type="button"
        aria-label="Toggle theme"
        aria-pressed="false"
        title="Toggle theme"
        onclick="toggleTheme()"
        style="display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.35rem .6rem;border-radius:.6rem;"
      >
        <span id="theme-icon-on" class="fa-solid fa-moon"></span>
        <span id="theme-icon-off" class="fa-solid fa-sun" style="display:none;"></span>
        <span class="d-none d-sm-inline">Theme</span>
      </button>

      <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('about') }}">
              <i class="fas fa-user me-1"></i> About
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('projects') }}">
              <i class="fas fa-code me-1"></i> Projects
            </a>
          </li>
          <li class="nav-item me-lg-3">
            <a class="nav-link" href="{{ url_for('resume') }}">
              <i class="fas fa-file-alt me-1"></i> Resume
            </a>
          </li>

          <!-- THEME TOGGLE (desktop placement inside nav) -->
          <li class="nav-item d-none d-lg-block">
            <button
              id="theme-toggle-desktop"
              class="btn btn-sm"
              type="button"
              aria-label="Toggle theme"
              aria-pressed="false"
              title="Toggle theme"
              onclick="toggleTheme()"
              style="display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.35rem .6rem;border-radius:.6rem;"
            >
              <span id="theme-icon-on-desktop" class="fa-solid fa-moon"></span>
              <span id="theme-icon-off-desktop" class="fa-solid fa-sun" style="display:none;"></span>
              Theme
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="container my-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  {% if not hide_footer %}
  <footer class="text-center py-4 mt-auto">
    <div class="container">
      <p>
        © 2025 Katie •
        <a href="https://github.com/ohitsmekatie" target="_blank">
          <i class="fab fa-github"></i> GitHub
        </a> •
        <a href="https://linkedin.com/in/katiesipos" target="_blank">
          <i class="fab fa-linkedin"></i> LinkedIn
        </a> •
        <a href="mailto:katie.sipos@gmail.com">
          <i class="fas fa-envelope"></i> Email
        </a>
      </p>
    </div>
  </footer>
  {% endif %}

  <!-- Terminal UI -->
  <div class="side-terminal">
    <div class="terminal-header">~ Terminal ~</div>
    <div id="terminal-output" class="terminal-output"></div>
    <div class="terminal-input-row">
      <span class="prompt-symbol">&gt;</span>
      <input id="terminal-input" type="text" placeholder="joke, fact, catfact, clear, or help" />
    </div>
  </div>

  <!-- Theme toggle logic -->
  <script>
    function applyTheme(theme) {
      const root = document.documentElement;
      const meta = document.querySelector('meta[name="theme-color"]');
      root.setAttribute("data-theme", theme);
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0d0d0d" : "#ffffff");

      // mobile toggle
      const on = document.getElementById("theme-icon-on");
      const off = document.getElementById("theme-icon-off");
      const btn = document.getElementById("theme-toggle");
      if (on && off) { on.style.display = theme === "dark" ? "inline-block" : "none"; off.style.display = theme === "dark" ? "none" : "inline-block"; }
      if (btn) btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");

      // desktop toggle
      const ond = document.getElementById("theme-icon-on-desktop");
      const offd = document.getElementById("theme-icon-off-desktop");
      const btnd = document.getElementById("theme-toggle-desktop");
      if (ond && offd) { ond.style.display = theme === "dark" ? "inline-block" : "none"; offd.style.display = theme === "dark" ? "none" : "inline-block"; }
      if (btnd) btnd.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem("site-theme", next);
      applyTheme(next);
    }

    // set initial button states on load
    (function(){
      const t = document.documentElement.getAttribute("data-theme") || "light";
      applyTheme(t);
    })();
  </script>

  <!-- Terminal Script -->
  <script>
    const input = document.getElementById('terminal-input');
    const output = document.getElementById('terminal-output');

    async function getJoke() {
      const res = await fetch("https://icanhazdadjoke.com/", {
        headers: { Accept: "application/json" }
      });
      const data = await res.json();
      return data.joke;
    }

    async function getFact() {
      const res = await fetch("https://uselessfacts.jsph.pl/api/v2/facts/random?language=en");
      const data = await res.json();
      return data.text;
    }

    async function getCatFact() {
      const res = await fetch("https://catfact.ninja/fact");
      const data = await res.json();
      return data.fact;
    }

    input.addEventListener('keydown', async function (e) {
      if (e.key === 'Enter') {
        const command = input.value.trim().toLowerCase();
        input.value = '';

        const inputLine = document.createElement('div');
        inputLine.textContent = `> ${command}`;
        output.appendChild(inputLine);

        let message = '';

        if (command === 'joke') {
          message = await getJoke();
        } else if (command === 'fact') {
          message = await getFact();
        } else if (command === 'catfact') {
          message = await getCatFact();
        } else if (command === 'clear') {
          output.innerHTML = '';
          return;
        } else if (command === 'help') {
          message = `Available commands:
  - joke
  - fact
  - catfact
  - help
  - clear`;
        } else {
          message = 'Unknown command. Try "help" for a list.';
        }

        const responseLine = document.createElement('div');
        responseLine.textContent = `> ${message}`;
        output.appendChild(responseLine);
        output.scrollTop = output.scrollHeight;
      }
    });
  </script>

  <!-- Bootstrap JS (optional but typical for navbar collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
