<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}whatisakatie?{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand glitch-title nav-glitch" href="{{ url_for('index') }}">what is a katie</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="{{ url_for('projects') }}">Projects</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('resume') }}">Resume</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About me</a></li>
            </ul>
          </div>
        </div>
      </nav>
      
      <main class="container my-5">
        {% block content %}{% endblock %}
      </main>
      
      <footer class="text-center py-4 mt-auto">
        <div class="container">
          <p>© 2025 ohitsmekatie • <a href="https://github.com/ohitsmekatie" target="_blank">GitHub</a></p>
        </div>
      </footer>
      
  </body>
</html>
